}

tasks.register('install') {
    dependsOn 'publishToMavenLocal'
}

tasks.register('uploadArchives') {
    doFirst {
        println "Attempting to upload version:$version"
    }
    dependsOn 'publishAllPublicationsToSonatypeRepository'
}

task installAll{  dependsOn installDist }

installDist.dependsOn downloadGsaLibFile

defaultTasks 'bundle'
